services:
  # ==========================================
  # Servicio de Base de Datos (PostgreSQL)
  # ==========================================
  postgres_db:
    image: postgres:16-alpine
    container_name: agrodirecto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agrodirecto}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgre}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persistencia de datos de PostgreSQL
      - postgres_data:/var/lib/postgresql/data
      # Script DDL de inicialización automática en primer arranque
      - ./src/main/resources/db/agrodirecto_schema_postgresql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agrodirecto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrodirecto-net

  # ==========================================
  # Servicio de Aplicación (Backend Spring Boot)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrodirecto-api
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8088}:8088"
    environment:
      # Configuración de conexión DataSource
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/${DB_NAME:-agrodirecto}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgre}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SERVER_PORT: ${SERVER_PORT:-8088}
      
      # Parámetros de seguridad JWT
      JWT_SECRET: ${JWT_SECRET:-AgroDirectoJWTSecretKey2026-UPC-Proyecto-Backend-Seguridad}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    volumes:
      # Persistencia para el archivo de logs de la aplicación
      - api_logs:/app/logs
    networks:
      - agrodirecto-net

# ==========================================
# Volúmenes y Redes
# ==========================================
volumes:
  postgres_data:
    name: agrodirecto_postgres_data
  api_logs:
    name: agrodirecto_api_logs

networks:
  agrodirecto-net:
    driver: bridge