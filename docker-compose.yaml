services:
  app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: ./agrodirecto-main
    container_name: agrodirecto-api
    ports:
      - "6868:8080"
    networks:
      - agrodirecto-network
    depends_on:
      - db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgre
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/agrodirecto
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgre
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./agrodirecto-main/src/main/resources/db/agrodirecto_schema_postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./datos_prueba_postgresql_bcrypt.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    restart: always
    container_name: db
    networks:
      - agrodirecto-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgre
      - POSTGRES_DB=agrodirecto
    ports:
      - "5433:5432"
volumes:
  db_data:
networks:
  my-network-name:
    name: springcloud